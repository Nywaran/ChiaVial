# ChíaVial · bloque para el sitio en aaPanel
# aaPanel → Website → (su dominio) → Conf → pegue esto DENTRO del bloque server { ... } del puerto 443,
# reemplazando cualquier bloque "location /" existente. (También sirve: Website → Reverse proxy → http://127.0.0.1:3000)
# Si cambió APP_PUERTO en .env, use ese mismo puerto en proxy_pass.
#
# ¡IMPORTANTE! La configuración que crea aaPanel trae dos bloques de caché de archivos estáticos:
#     location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { ... }
#     location ~ .*\.(js|css)?$ { ... }
# Bórrelos (o coméntelos con #): interceptan los .js, .css e imágenes de ChíaVial y los buscan en la carpeta
# del sitio en lugar de pedirlos a la app, y la página queda en blanco. No toque el bloque "well-known"
# (lo usa Let's Encrypt para renovar el certificado).

# Fotos de reportes: hasta 3 × 5 MB por envío
client_max_body_size 20m;

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
