# ChíaVial · bloque para el sitio en aaPanel
# aaPanel → Website → (su dominio) → Conf → pegue esto DENTRO del bloque server { ... } del puerto 443,
# reemplazando cualquier bloque "location /" existente. (También sirve: Website → Reverse proxy → http://127.0.0.1:3000)

# Fotos de reportes: hasta 3 × 5 MB por envío
client_max_body_size 20m;

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
